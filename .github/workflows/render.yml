name: Render video

# The render farm. Dispatched by the app; each run renders exactly one job.
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Render job id
        required: true
      job_token:
        description: Single-job access token
        required: true
      app_url:
        description: Base URL of the AutoCut Studio app
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Remotion needs these to run headless Chromium on the runner.
      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 ffmpeg

      - name: Install worker dependencies
        working-directory: render-worker
        run: npm install --no-audit --no-fund

      # The composition entry point lives in the main app's src/remotion
      # folder (so preview and export stay pixel-identical), so webpack's
      # module resolution needs a node_modules at the repo root too -
      # otherwise imports like lucide-react used by composition components
      # can't be found.
      - name: Install app dependencies (for composition module resolution)
        run: npm install --no-audit --no-fund

      - name: Render
        working-directory: render-worker
        env:
          JOB_ID: ${{ inputs.job_id }}
          JOB_TOKEN: ${{ inputs.job_token }}
          APP_URL: ${{ inputs.app_url }}
        run: node render.mjs
